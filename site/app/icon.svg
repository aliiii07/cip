<!-- The tab icon. Deliberately a bolder cut of the CIP mark than the master
     artwork in components/Logo.tsx: browsers that support SVG favicons prefer
     this file over favicon.ico and render it at 16-20px, where the master's
     46-unit stroke falls below one pixel and the line disappears. Same
     geometry, scaled up inside the square with a heavier stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" rx="232" fill="#0A0A0A"/>
  <g transform="translate(632.5 593.5) scale(1.24) translate(-632.5 -593.5)">
    <path d="M292 818 L470 880 L645 592 L818 668 L900 452" stroke="#FFFFFF" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="905" cy="375" r="92" fill="#E23B3B"/>
  </g>
</svg>
