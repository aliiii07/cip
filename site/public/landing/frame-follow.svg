  <rect x="248" y="300" width="444" height="232" rx="18" fill="#1C1C1E" stroke="#3F3F46"/>
  <text x="278" y="348" font-family="Figtree, sans-serif" font-size="22" font-weight="600" fill="#fff">Global Equity Book</text>
  <text x="278" y="378" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Paper session · live data</text>
  <rect x="278" y="404" width="384" height="1" fill="#3F3F46"/>
  <text x="278" y="438" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Expectancy ranked</text>
  <text x="662" y="438" text-anchor="end" font-family="Inter, sans-serif" font-size="13" fill="#fff">Verified</text>
  <text x="278" y="470" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Risk review</text>
  <text x="662" y="470" text-anchor="end" font-family="Inter, sans-serif" font-size="13" fill="#fff">Passed</text>
  <rect x="248" y="566" width="444" height="64" rx="32" fill="#fff"/>
  <text x="470" y="606" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" font-weight="600" fill="#0A0A0A">Copy into paper</text>
  <text x="470" y="676" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">One tap. No brokerage. No real money.</text>
