<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1200" viewBox="0 0 940 1200">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A3E"/><stop offset=".45" stop-color="#1A1A1D"/>
      <stop offset=".55" stop-color="#232327"/><stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E6C69"/><stop offset=".5" stop-color="#2C2C2F"/>
      <stop offset="1" stop-color="#5A5854"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-15%" width="160%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <clipPath id="scr"><rect x="212" y="96" width="516" height="1008" rx="46"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <rect x="196" y="80" width="548" height="1040" rx="66" fill="url(#rim)"/>
    <rect x="202" y="86" width="536" height="1028" rx="62" fill="url(#body)"/>
    <rect x="212" y="96" width="516" height="1008" rx="46" fill="#0E0E10"/>
  </g>

  <g clip-path="url(#scr)">
    <rect x="212" y="96" width="516" height="1008" fill="#111114"/>
    
  <text x="248" y="196" font-family="Figtree, sans-serif" font-size="30" font-weight="600" fill="#fff">Build &amp; track</text>
  <rect x="248" y="220" width="120" height="3" rx="1.5" fill="#9F9D9B"/>
  
  <rect x="248" y="246" width="104" height="26" rx="6" fill="none" stroke="#9F9D9B" stroke-width="1.4" opacity=".9"/>
  <text x="262" y="264" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.6" fill="#C2C0BC">SIMULATED</text>
  <rect x="248" y="300" width="444" height="120" rx="18" fill="#1C1C1E" stroke="#3F3F46"/>
  <text x="278" y="342" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Paper funds</text>
  <text x="278" y="390" font-family="Figtree, sans-serif" font-size="38" font-weight="600" fill="#fff">$100,000</text>
  <rect x="248" y="446" width="444" height="196" rx="18" fill="#1C1C1E" stroke="#3F3F46"/>
  <text x="278" y="486" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Strategy editor</text>
  <polyline points="278,600 330,572 382,588 434,536 486,556 538,514 590,528 642,492"
     fill="none" stroke="#9F9D9B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="642" cy="492" r="5" fill="#C2C0BC"/>
  <text x="278" y="702" font-family="Inter, sans-serif" font-size="13" fill="#A1A1AA">Simulated money. Zero real-money risk.</text>
  </g>

  <!-- dynamic island + side hardware -->
  <rect x="424" y="118" width="92" height="26" rx="13" fill="#000"/>
  <circle cx="502" cy="131" r="5" fill="#16161A"/>
  <rect x="192" y="300" width="5" height="64" rx="3" fill="#8A8886" opacity=".85"/>
  <rect x="192" y="392" width="5" height="104" rx="3" fill="#8A8886" opacity=".85"/>
  <rect x="743" y="352" width="5" height="132" rx="3" fill="#8A8886" opacity=".85"/>
  <rect x="212" y="96" width="516" height="1008" rx="46" fill="url(#glass)"/>
  <title>Build and track on paper</title>
</svg>